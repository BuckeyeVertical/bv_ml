# Linux x86_64 with an NVIDIA GPU; create with: conda env create -f environment.yml
# Maintain direct dependencies here. Do not replace this file with conda env export.
name: bv_ml
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip=26.2
  - pip:
      # Use one CUDA-enabled PyTorch installation. CUDA libraries are wheel dependencies.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - "--only-binary=:all:"
      - torch==2.7.0+cu126
      - torchvision==0.22.0+cu126
      # YOLO26 training and online run tracking.
      - ultralytics==8.4.175
      - wandb==0.30.0
      # Ultralytics requires this when launching multi-GPU workers.
      - cloudpickle==3.1.1
      # Dataset conversion and repository checks.
      - PyYAML==6.0.3
      - Pillow==12.3.0
      - ruff==0.16.10
variables:
  PYTHONPATH: "."
